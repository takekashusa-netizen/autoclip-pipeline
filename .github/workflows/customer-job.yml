# Free clip engine: replaces the paid Railway "api" service.
# Triggered by takekash.com (Netlify) via repository_dispatch; runs on a standard GitHub-hosted runner,
# which is free for public repositories. Logs are public, so the worker prints nothing customer-specific.
name: customer-job

on:
  repository_dispatch:
    types: [customer-job]

permissions:
  contents: read

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            web/requirements.txt
            worker/requirements.txt

      - name: System tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng

      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Python packages
        run: |
          pip install -q -r web/requirements.txt -r worker/requirements.txt \
            numpy opencv-python-headless pillow anthropic faster-whisper cryptography boto3
          chmod +x *.sh skills/*.sh skills/*/run.sh 2>/dev/null || true

      - name: Make the clips
        env:
          # Passed through env (never interpolated into the shell) so a ticket can't inject commands.
          TICKET: ${{ toJSON(github.event.client_payload) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
          BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
          BUCKET_REGION: ${{ secrets.BUCKET_REGION }}
          SITE_PUBKEY_URL: https://takekash.netlify.app/api/pubkey
          SITE_CALLBACK_URL: https://takekash.netlify.app/api/clip-job-done
          PIPELINE_WHISPER_MODEL: small
          CUSTOMER_FORMAT: short-tiktok-raw
          CUSTOMER_CLIP_LENGTH: "45"
        run: python worker/actions_customer_job.py
